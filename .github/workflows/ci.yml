name: Nexa CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://nexa:nexa@localhost:5432/nexa
      JWT_SECRET: ci-only-test-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa
          POSTGRES_DB: nexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall apps/api/app apps/api/alembic
      - run: cd apps/api && alembic upgrade head
      - run: cd apps/api && PYTHONPATH=. pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: cd apps/web && npm install
      - run: cd apps/web && npm run build
