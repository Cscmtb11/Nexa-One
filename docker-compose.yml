services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexa
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa
    ports:
      - "5432:5432"
    volumes:
      - nexa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexa"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://nexa:nexa@db:5432/nexa
      ENVIRONMENT: development
      AI_ENABLED: "false"
      AI_GATEWAY_URL: https://ai.springnexa.in
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on: [api]

volumes:
  nexa_pg:
